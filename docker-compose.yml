services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: svenska
      POSTGRES_PASSWORD: svenska
      POSTGRES_DB: svenska
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svenska -d svenska"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    profiles: ["app"]
    build:
      context: .
      target: builder
    command: sh -c "pnpm db:migrate && pnpm db:seed"
    environment:
      DATABASE_URL: postgres://svenska:svenska@db:5432/svenska
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: ["app"]
    build:
      context: .
      target: dev
    environment:
      DATABASE_URL: postgres://svenska:svenska@db:5432/svenska
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - industrins-svenska_node_modules:/app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  industrins-svenska_node_modules:
